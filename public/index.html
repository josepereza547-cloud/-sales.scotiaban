<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticacion</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
    <style>
        :root {
            --red:      #ed0722;
            --red-dark: #d4061e;
            --bg:       #ffffff;
            --text:     #222222;
            --text-ph:  #b0b4bb;
            --text-sec: #777777;
            --border:   #dde1e7;
            --icon-sec: #aaaaaa;
            --blue-link:#087bb4;
            --orange:   #f97316;
            --purple:   #8230df;
            --green:    #008660;
            --font:     'Source Sans 3', Arial, Helvetica, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            font-family: var(--font);
            font-size: 10px;
            height: 100%;
            color: var(--text);
            background: var(--bg);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        .panel-left {
            background: #ffffff;
            padding: 7.2rem 8rem 7.2rem 7.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 4.8rem;
            text-decoration: none;
            width: fit-content;
        }
        .logo__s {
            height: 2.4rem;
            width: auto;
            flex-shrink: 0;
        }
        .logo__divider {
            width: 0.1rem;
            height: 2.8rem;
            background: #dde1e7;
            flex-shrink: 0;
        }
        .logo__wordmark {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            line-height: 1;
        }
        .logo__main {
            font-size: 1.8rem;
            font-weight: 700;
            color: #222;
            letter-spacing: -0.01em;
            line-height: 1;
        }
        .logo__light {
            font-size: 1.3rem;
            font-weight: 400;
            color: #888;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        .welcome {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 3.6rem 0;
            line-height: 1.2;
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loader-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .loader__logo {
            height: 6rem;
            width: auto;
            animation: logoPulse 1.4s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1);   opacity: 1; }
            50%       { transform: scale(1.06); opacity: 0.75; }
        }
        .loader__bar-track {
            width: 22rem;
            height: 0.4rem;
            background: #eee;
            border-radius: 2rem;
            overflow: hidden;
        }
        .loader__bar-fill {
            height: 100%;
            width: 0%;
            background: #E30518;
            border-radius: 2rem;
            transition: width linear;
        }
        .loader__msg {
            font-size: 1.5rem;
            color: #888;
            letter-spacing: 0.02em;
        }

        .form { width: 100%; }

        .field {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.2rem 0;
            border-bottom: 0.12rem solid var(--border);
            margin-bottom: 2.8rem;
            transition: border-color 0.18s;
        }
        .field:focus-within { border-bottom-color: var(--red); }

        .field__icon {
            color: var(--icon-sec);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.2rem;
            height: 2.2rem;
        }
        .field__icon svg { width: 2.2rem; height: 2.2rem; }

        .field__input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: var(--font);
            font-size: 1.85rem;
            color: var(--text);
            outline: none;
            padding: 0;
            min-width: 0;
        }
        .field__input::placeholder { color: var(--text-ph); }

        .field__toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--icon-sec);
            display: flex;
            align-items: center;
            padding: 0;
            flex-shrink: 0;
        }
        .field__toggle svg { width: 2rem; height: 2rem; }
        .field__toggle:focus-visible { outline: 2px solid var(--red); border-radius: 2px; }

        .btn-enter {
            width: 100%;
            background: #ffffff;
            border: 0.12rem solid var(--border);
            border-radius: 0.35rem;
            font-family: var(--font);
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--text-sec);
            padding: 1.5rem 2rem;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.18s, color 0.18s, box-shadow 0.18s;
            margin-bottom: 2.4rem;
            letter-spacing: 0.01em;
        }
        .btn-enter:hover {
            border-color: #b0b4bb;
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .btn-enter:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

        .info-card {
            display: flex;
            align-items: flex-start;
            gap: 1.4rem;
            border: 0.12rem solid var(--border);
            border-radius: 0.35rem;
            padding: 1.6rem 1.8rem;
            margin-bottom: 1.2rem;
        }
        .info-card__icon {
            flex-shrink: 0;
            width: 3.2rem;
            height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-card__icon svg { width: 2.6rem; height: 2.6rem; }
        .info-card__body { flex: 1; }
        .info-card__text {
            font-size: 1.4rem;
            color: var(--text-sec);
            line-height: 1.55;
            margin: 0;
        }
        .info-card__link {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--blue-link);
            text-decoration: none;
            display: inline-block;
            margin-top: 0.3rem;
        }
        .info-card__link:hover { text-decoration: underline; }

        .panel-right {
            position: relative;
            background: #ed1c6e;
            overflow: hidden;
            display: flex;
            align-items: stretch;
        }

        .panel-right::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                #f72060 0%,
                #e0105a 45%,
                #c20a4d 100%
            );
            z-index: 0;
        }

        .panel-right::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 60% 25%, rgba(255,255,255,0.13) 0%, transparent 55%),
                radial-gradient(ellipse at 30% 85%, rgba(0,0,0,0.12) 0%, transparent 45%);
            z-index: 1;
        }

        .person-wrap {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .person-svg {
            width: auto;
            height: 88%;
            max-height: 700px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            z-index: 3;
            border: 0.15rem solid rgba(255,255,255,0.18);
        }
        .c1 { width: 36rem; height: 36rem; top: -12rem; right: -10rem; background: rgba(255,255,255,0.05); }
        .c2 { width: 22rem; height: 22rem; bottom: 6rem; left: -6rem; background: rgba(255,255,255,0.04); }
        .c3 { width: 10rem; height: 10rem; top: 42%; right: 4rem; background: rgba(255,255,255,0.07); border: none; }

        .right-brand {
            position: absolute;
            top: 3.6rem;
            left: 3.6rem;
            z-index: 10;
        }
        .right-brand__logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .right-brand__s {
            width: 3.6rem;
            height: 3.6rem;
            background: rgba(255,255,255,0.2);
            border-radius: 0.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .right-brand__name {
            font-size: 1.6rem;
            font-weight: 700;
            color: rgba(255,255,255,0.92);
            letter-spacing: 0.01em;
        }

        .right-tagline {
            position: absolute;
            bottom: 4rem;
            left: 3.6rem;
            z-index: 10;
            max-width: 30rem;
        }
        .right-tagline h2 {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 0.8rem 0;
            line-height: 1.2;
        }
        .right-tagline p {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.75);
            margin: 0;
            line-height: 1.5;
        }

        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            .panel-right { min-height: 30rem; order: -1; }
            .panel-left { padding: 4rem 3.2rem; }
            .welcome { font-size: 2.6rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

            <div class="logo__wordmark">
                <span class="logo__light">Colpatria</span>

        <h1 class="welcome">Bienvenido a<br>Portal de Ventas</h1>

        <form class="form" id="loginForm" novalidate autocomplete="off">

            <div class="field">
                <span class="field__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <input class="field__input" type="text" id="username" name="username" placeholder="Usuario" autocomplete="username" required>
            </div>

            <div class="field">
                <span class="field__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

                    </svg>
                </span>
                <input class="field__input" type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                <button type="button" class="field__toggle" id="togglePwd" aria-label="Mostrar contraseña">

                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-enter">Ingresar</button>

        </form>
