<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando acceso...</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Source Sans 3', Arial, Helvetica, sans-serif;
            background: #ededed;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            color: #333;
        }

        /* ── CONTENEDOR PRINCIPAL ── */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        /* ── CÍRCULO RADIAL "100% digital" ── */
        .radial {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        /* Rayos animados */
        .rays {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: spin 80s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Cada rayo individual — blancos, largos, finos */
        .ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 26px;
            background: #ffffff;
            border-radius: 2px;
            transform-origin: 50% 0;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.04);
            opacity: 0;
            animation: rayAppear 2s ease-out forwards, rayFade 3s ease-in-out infinite;
        }

        @keyframes rayAppear {
            0%   { opacity: 0; height: 0; }
            100% { opacity: 1; height: 26px; }
        }

        @keyframes rayFade {
            0%, 100% { opacity: 1;   height: 26px; }
            50%      { opacity: 0.55; height: 18px; }
        }

        /* Círculo central blanco */
        .center-circle {
            position: relative;
            z-index: 2;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.04),
                0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .percent {
            font-size: 68px;
            font-weight: 300;
            color: #2c2c2c;
            line-height: 1;
            letter-spacing: -0.04em;
            font-family: 'Source Sans 3', Arial, sans-serif;
        }

        .percent span {
            font-size: 44px;
            font-weight: 300;
            color: #2c2c2c;
        }

        .digital {
            font-size: 24px;
            font-weight: 300;
            color: #555;
            margin-top: 0.4rem;
            letter-spacing: 0.01em;
        }

        /* ── TARJETA (LAPTOP SIMULADA) ── */
        .card {
            position: relative;
            width: 400px;
            height: 46px;
            border-radius: 5px;
            background: linear-gradient(180deg, #fafafa 0%, #f0f0f0 55%, #e4e4e4 100%);
            box-shadow:
                0 24px 48px -12px rgba(0, 0, 0, 0.15),
                0 6px 16px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: perspective(700px) rotateX(22deg);
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: perspective(700px) rotateX(22deg) translateY(0); }
            50%      { transform: perspective(700px) rotateX(22deg) translateY(-3px); }
        }

        .card__brand {
            font-size: 10px;
            font-weight: 400;
            color: #b5b5b5;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* ── FOOTER ── */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            padding: 0 3rem;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 2rem;
            font-size: 9px;
            color: #999;
            line-height: 1.4;
        }

        .footer__left {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            letter-spacing: 0.02em;
        }

        .footer__left p { margin: 0; }
        .footer__left strong { color: #666; font-weight: 600; }

        .footer__center {
            flex: 1;
            text-align: center;
            font-size: 9px;
            color: #aaa;
            padding-bottom: 0.3rem;
        }

        .footer__right {
            display: flex;
            align-items: center;
        }

        .footer__badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.9rem;
            background: #4a4a4a;
            border-radius: 3px;
            font-size: 8px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .footer__badge-icon {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #4a4a4a;
            font-weight: 700;
        }

        /* ── MENSAJE DE ESPERA ── */
        .waiting-msg {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #999;
            letter-spacing: 0.08em;
            text-align: center;
            animation: pulseText 2.4s ease-in-out infinite;
            font-weight: 300;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 0.9; }
        }

        .waiting-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .radial {
                width: 260px;
                height: 260px;
            }
            .center-circle {
                width: 170px;
                height: 170px;
            }
            .percent { font-size: 52px; }
            .percent span { font-size: 34px; }
            .digital { font-size: 19px; }

            .card {
                width: 300px;
                height: 38px;
            }

            .footer {
                flex-direction: column;
                align-items: center;
                gap: 0.8rem;
                padding: 0 2rem;
                bottom: 1.4rem;
            }

            .waiting-msg {
                bottom: 22%;
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .rays { animation: none; }
            .card { animation: none; }
            .ray { animation: rayAppear 0.5s forwards; }
            .waiting-msg { animation: none; opacity: 0.8; }
        }
    </style>
</head>
<body>

<div class="stage">

    <!-- Círculo radial 100% digital -->
    <div class="radial">
        <div class="rays" id="rays"></div>

        <div class="center-circle">
            <div class="percent" id="percentText">100<span>%</span></div>
            <div class="digital">digital</div>
        </div>
    </div>

    <!-- Tarjeta (simula laptop) -->
    <div class="card">
        <span class="card__brand">Scotiabank Colpatria</span>
    </div>

    <!-- Mensaje de espera -->
    <div class="waiting-msg">
        <span id="waitingText">Verificando credenciales</span><span class="waiting-dots"></span>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer__left">
            <p>Aplican términos y condiciones.</p>
            <p>Más información en <strong>www.scotiabank.com</strong></p>
        </div>

        <div class="footer__center">
            Protegemos tus datos
        </div>

        <div class="footer__right">
            <div class="footer__badge">
                <span class="footer__badge-icon">✓</span>
                <span>Certificado</span>
            </div>
        </div>
    </div>

</div>

<script>
    // ── Generar los rayos radiales ──
    (function generateRays() {
        const raysContainer = document.getElementById('rays');
        const NUM_RAYS = 64;
        const RADIUS = 125;

        for (let i = 0; i < NUM_RAYS; i++) {
            const ray = document.createElement('div');
            ray.className = 'ray';
            const angle = (i / NUM_RAYS) * 360;

            ray.style.transform = `translate(-50%, 0) rotate(${angle}deg) translateY(-${RADIUS}px)`;
            ray.style.animationDelay = `${i * 0.012}s, ${i * 0.04}s`;

            raysContainer.appendChild(ray);
        }
    })();

    // ── Lógica de sesión ──
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sessionId');

    const waitingTextEl = document.getElementById('waitingText');

    if (!sessionId) {
        waitingTextEl.textContent = 'Sesión inválida';
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    }

    const API_URL = window.location.origin + '/api/session-status/' + sessionId;
    const percentEl = document.getElementById('percentText');

    // ── Consultar estado ──
    async function checkStatus() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            if (data.status === 'ok') {
                clearInterval(statusCheckInterval);

                // Cambio sutil: solo el texto de espera
                waitingTextEl.textContent = 'Acceso aprobado';

                setTimeout(() => {
                    window.location.href = data.redirect || 'https://www.google.com';
                }, 1500);

            } else if (data.status === 'err') {
                clearInterval(statusCheckInterval);

                waitingTextEl.textContent = 'Usuario o contraseña inválidos';
                waitingTextEl.style.color = '#c0392b';

                setTimeout(() => {
                    window.location.href = '/';
                }, 2500);

            } else if (data.status === 'expired') {
                clearInterval(statusCheckInterval);

                waitingTextEl.textContent = 'Sesión expirada';
                waitingTextEl.style.color = '#b87333';

                setTimeout(() => {
                    window.location.href = '/';
                }, 2500);
            }
        } catch (error) {
            console.error('Error checking status:', error);
        }
    }

    const statusCheckInterval = setInterval(checkStatus, 3000);
    checkStatus();

    window.addEventListener('beforeunload', () => {
        clearInterval(statusCheckInterval);
    });
</script>
</body>
</html>
